<body>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="#customers"><span class="brand-mark">S</span><span>総研<span class="brand-sub">CUSTOMER WORKSPACE</span></span></a>
    <div class="workspace-label">顧客データ管理 <span>Ph1</span></div>
    <nav aria-label="メインメニュー">
      <button data-view="customers" class="nav active"><span>▦</span>顧客一覧</button>
      <button data-view="import" class="nav"><span>↥</span>Sansan CSV取込</button>
      <button data-view="image" class="nav"><span>▣</span>名刺から登録</button>
      <button data-view="reviews" class="nav"><span>◈</span>重複確認 <b id="review-count">0</b></button>
      <button data-view="history" class="nav"><span>◷</span>取込・変更履歴</button>
    </nav>
    <div class="sidebar-bottom"><div class="connection-dot"></div><span id="side-connection">接続を確認中</span><p>取得経路・受信希望・停止を<br>分けて管理します。</p></div>
  </aside>
  <div class="main-wrap">
    <header class="topbar"><span>総研マーケティング工場 <span class="slash">/</span> 顧客管理</span><div><a id="sheet-link" target="_blank" rel="noopener" hidden>スプレッドシートを開く ↗</a><span class="avatar">S</span></div></header>
    <div id="mode-banner" class="mode-banner">読み込んでいます…</div>
    <main id="main"><div class="loading">顧客データを読み込んでいます…</div></main>
    <footer>顧客データ管理 · 初期版 <span>メール送信機能は含みません</span></footer>
  </div>
</div>
<div id="notice" role="status" aria-live="polite" hidden></div>
<dialog id="editor" aria-labelledby="editor-title"><form id="customer-form">
  <header class="dialog-head"><div><span class="eyebrow">CUSTOMER PROFILE</span><h2 id="editor-title">顧客を登録</h2></div><button type="button" class="icon-button" data-close aria-label="閉じる">×</button></header>
  <div class="dialog-body">
    <p id="editor-hint" class="note"></p><input name="id" type="hidden"><input name="version" type="hidden"><input name="imageId" type="hidden">
    <div class="form-grid">
      <label>氏名<input name="name" autocomplete="name" maxlength="1000" placeholder="山田 太郎"></label><label>会社名<input name="company" autocomplete="organization" maxlength="1000" placeholder="株式会社〇〇"></label>
      <label>部署<input name="department" maxlength="1000"></label><label>役職<input name="title" maxlength="1000"></label>
      <label class="wide">メールアドレス<input name="email" type="email" maxlength="1000" autocomplete="email" placeholder="name@example.com"></label>
      <label>電話番号<input name="phone" type="tel" maxlength="1000"></label><label>氏名カナ<input name="kana" maxlength="1000"></label>
      <label>第2メール<input name="email2" type="email" maxlength="1000"></label><label>取得経路<select name="source"><option>手入力</option><option>名刺画像</option><option>Sansan</option><option>Web</option><option>その他</option></select></label>
    </div>
    <details><summary>Sansan識別情報</summary><div class="form-grid"><label>人物ID<input name="personId"></label><label>名刺ID<input name="cardId"></label><label>会社ID<input name="companyId"></label></div></details>
    <div class="section-divider"></div><h3>受信希望と配信停止</h3><p class="help">顧客登録や名刺交換だけでは、購読同意にしません。</p>
    <div class="form-grid"><label>購読同意<select name="consent"><option>未確認</option><option>確認手続中</option><option>同意済み</option><option>拒否</option></select></label><label>同意日時<input name="consentAt" type="datetime-local"></label><label>同意の確認方法<input name="consentMethod" placeholder="本人からの返信など" maxlength="1000"></label><label>同意の証拠・記録場所<input name="consentEvidence" placeholder="受付番号や保管先" maxlength="1000"></label></div>
    <label class="stop-box"><input name="stopped" type="checkbox"><span><strong>配信を停止する</strong><small>停止は再取込・顧客編集でも維持されます。この初期版では解除できません。</small></span></label>
    <label>停止理由<input name="stopReason" maxlength="1000"></label><label>メモ<textarea name="memo" rows="3" maxlength="5000"></textarea></label>
    <div id="form-error" class="inline-error" role="alert" hidden></div>
  </div>
  <div class="dialog-foot"><button type="button" class="button" data-close>キャンセル</button><button type="submit" class="button primary" id="save-button">保存する</button></div>
</form></dialog>
<script>/* Keep this guard independent of the application bundle so startup errors remain visible. */
(function () {
  var complete = false;
  function failure(message) {
    if (complete) return;
    clearTimeout(timer);
    var main = document.getElementById('main');
    var box = document.createElement('div'); box.className = 'panel empty';
    var title = document.createElement('h2'); title.textContent = '読み込めませんでした';
    var detail = document.createElement('p'); detail.textContent = message;
    var button = document.createElement('button'); button.className = 'button'; button.textContent = '画面を再読み込み';
    button.onclick = function () { window.location.reload(); };
    box.appendChild(title); box.appendChild(detail); box.appendChild(button); main.replaceChildren(box);
    document.getElementById('mode-banner').textContent = '読込を完了できませんでした';
    document.getElementById('side-connection').textContent = '接続未確認';
  }
  window.appBoot = {
    ready: function () { complete = true; clearTimeout(timer); },
    fail: failure
  };
  window.addEventListener('error', function (event) {
    failure('画面の起動処理でエラーが発生しました。詳細：' + event.message + '（' + event.filename.split('/').pop().split('?')[0] + '、行 ' + event.lineno + '、列 ' + event.colno + '）');
  });
  var timer = setTimeout(function () {
    failure('読込に時間がかかっています。画面を再読み込みしてください。解消しない場合は、この表示を担当者にお知らせください。');
  }, 45000);
}());

  const TABLES = ['customers', 'reviews', 'imports', 'raw', 'events', 'images', 'stops'];
  const TEXT_FIELDS = ['name','company','department','title','email','email2','phone','kana','memo','personId','cardId','companyId','consentAt','consentMethod','consentEvidence','stopReason'];
  const copy = x => JSON.parse(JSON.stringify(x));

  function empty() { return Object.fromEntries(TABLES.map(k => [k, []])); }
  function parseCsv(input) {
    const text = String(input).replace(/^\uFEFF/, '');
    const rows = []; let row = [], field = '', quoted = false, after = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (quoted) {
        if (c === '"' && text[i+1] === '"') { field += '"'; i++; }
        else if (c === '"') { quoted = false; after = true; }
        else field += c;
      } else if (c === '"' && !field && !after) quoted = true;
      else if (c === ',') { row.push(field); field = ''; after = false; }
      else if (c === '\r' || c === '\n') {
        row.push(field); rows.push(row); row = []; field = ''; after = false;

    main.innerHTML=heading('名刺から登録','スマホで撮影。読み取った内容を確認して、顧客として登録します。')+`<div class="two-col"><section class="panel"><div class="panel-head"><h3>名刺を撮影・選択</h3>${pill('JPEG / PNG','source')}</div><div class="panel-body"><label class="drop-zone"><div class="drop-icon">▣</div><h3>名刺の画像を選ぶ</h3><p class="help">明るい場所で、名刺全体をまっすぐ撮影してください。</p><input id="image-input" type="file" accept="image/jpeg,image/png" capture="environment" aria-label="名刺画像を撮影または選択"></label><p class="help">保存済み写真を選ぶ場合は、下の「写真から選ぶ」を使えます。</p><label>写真から選ぶ<input id="photo-input" type="file" accept="image/jpeg,image/png" aria-label="写真から選ぶ"></label><div id="image-preview"></div><button class="button primary" id="read-image" disabled>画像を保存して文字を読み取る</button><p class="file-meta">5MBまで。原画像と読取結果を設定したGoogle Driveフォルダに保存します。</p></div></section><section class="panel"><div class="panel-head"><h3>確認してから登録</h3></div><div class="panel-body"><ol class="steps"><li><strong>Googleで文字を読み取る</strong>画像をGoogleドキュメントへ変換して読み取ります。初回にDrive APIの設定が必要です。</li><li><strong>読み間違いを確認</strong>メール・電話は入力候補を表示。氏名・会社・部署を確認して入力します。</li><li><strong>重複を確認して保存</strong>既存のCSV・手入力データとも照合します。画像から購読同意は付けません。</li></ol><div id="ocr-result"></div></div></section></div>`;
    imageFile=null;
  } else if(view==='reviews') {
    const pending=data.reviews.filter(r=>r.status==='確認待ち');
    main.innerHTML=heading('重複確認','同じ人かもしれない登録を、人の判断で確認します。')+`<p class="note">同じ人なら既存顧客へ取得履歴を追加します。氏名・メール・同意・停止を自動で上書きしません。候補が同じCSV内にある場合は、まず片方を確認して登録してから、もう片方を関連付けられます。</p>`+(pending.length?pending.map(r=>{
      const current=CustomerCore.matches(r.incoming,data.customers);
      return `<article class="review-card" data-review="${esc(r.id)}"><div>${pill('確認待ち','amber')} <span class="file-meta">${esc(r.source)} · ${date(r.at)}</span></div><div class="review-grid"><div class="compare-box"><h3>新しく入ってきた情報</h3><strong>${esc(r.incoming.name||'氏名未入力')}</strong>${esc(r.incoming.company)}<br>${esc(r.incoming.email||'メール未入力')}<br><span class="secondary">${esc(r.reason||'')}</span></div><div class="compare-box"><h3>既存顧客の候補</h3>${current.length?current.map(c=>`<strong>${esc(c.name)} / ${esc(c.company)}</strong>${esc(c.email)}<br><span class="file-meta">${esc(c.reasons.join('・'))}</span>`).join('<hr>'):'現在の一覧には一致候補がありません。同じCSV内の別行、または形式不備を確認してください。'}</div></div><label>判断の理由<input class="review-reason" placeholder="名刺の内容を確認して同じ人と判断、など" maxlength="1000"></label><div class="review-actions"><select class="review-target" aria-label="関連付け先の顧客"><option value="">関連付け先を選択</option>${current.map(c=>`<option value="${esc(c.id)}">${esc(c.name)} / ${esc(c.company)}</option>`).join('')}</select><button class="button primary" data-resolve="existing" ${current.length?'':'disabled'}>同じ人・関連付ける</button><button class="button" data-resolve="new">別人・新しく登録</button></div><p class="file-meta">${esc(r.id)}</p></article>`;
    }).join(''):'<div class="panel empty">確認待ちの候補はありません。</div>');
  } else {
    main.innerHTML=heading('取込・変更履歴','いつ、誰が、どの情報を登録・変更したかを確認できます。')+`<section class="panel"><div class="panel-head"><h3>CSV取込履歴</h3></div><div class="table-wrap"><table><thead><tr><th>ファイル</th><th>日時</th><th>新規登録</th><th>確認待ち</th><th>空行</th><th>原本</th></tr></thead><tbody>${data.imports.slice().reverse().map(x=>`<tr><td>${esc(x.name)}</td><td>${date(x.at)}</td><td>${x.created}件</td><td>${x.pending}件</td><td>${x.blank}件</td><td>${x.fileId?`<a href="https://drive.google.com/file/d/${encodeURIComponent(x.fileId)}/view" target="_blank" rel="noopener">開く ↗</a>`:'デモ内のみ'}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">取込履歴はありません。</td></tr>'}</tbody></table></div></section><div style="height:24px"></div><section class="panel"><div class="panel-head"><h3>最近の変更（最大100件）</h3></div><div class="table-wrap"><table><thead><tr><th>日時</th><th>操作</th><th>担当者</th><th>記録ID</th></tr></thead><tbody>${data.events.map(x=>`<tr><td>${date(x.at)}</td><td>${esc(x.type)}</td><td>${esc(x.actor)}</td><td class="secondary">${esc(x.id.slice(0,18))}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">変更履歴はありません。</td></tr>'}</tbody></table></div></section>`;
  }
}
function openEditor(c={}) {
  const form=$('#customer-form');form.reset();$('#form-error').hidden=true;
  Array.from(form.elements).forEach(el=>{if(el.name && el.type!=='checkbox')el.value=c[el.name] || '';});
  form.elements.source.value=c.source || '手入力';form.elements.consent.value=c.consent || '未確認';form.elements.source.disabled=Boolean(c.id);
  form.elements.version.value=c.version || '';
  const stopped=c.id?status(c).stopped:Boolean(c.stopped);form.elements.stopped.checked=stopped;form.elements.stopped.disabled=stopped;
  if(c.consentAt){const d=new Date(c.consentAt);if(!isNaN(d))form.elements.consentAt.value=new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,16);}
  $('#editor-title').textContent=c.id?'顧客情報を編集':'顧客を登録';
  $('#editor-hint').textContent=c.id?'顧客IDは維持されます。メール変更時は、同意を未確認へ戻します。':c.imageId?'名刺画像の読取候補です。氏名・会社・メールを確認して保存してください。':'氏名・会社名・メールのいずれかを入力してください。保存時に重複を確認します。';
  $('#editor').showModal();
}
async function filePayload(file) {
  const buf=await file.arrayBuffer();let binary='';const bytes=new Uint8Array(buf);
  for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));
  return {name:file.name,mime:file.type,base64:btoa(binary)};
}
async function csvPreview() {
  const target=$('#csv-preview');if(!csvFile)return;
  try {
    const text=new TextDecoder($('#encoding').value==='Shift_JIS'?'shift-jis':'utf-8',{fatal:true}).decode(await csvFile.arrayBuffer());
    const p=CustomerCore.csvPlan(text,data);
    target.innerHTML=`<h3>${esc(csvFile.name)}</h3><div class="preview-summary"><span><b>${p.items.length}</b>件</span><span><b>${p.candidates}</b>重複候補</span><span><b>${p.blank}</b>空行</span></div><div class="table-wrap"><table><thead><tr><th>氏名</th><th>会社</th><th>確認</th></tr></thead><tbody>${p.items.slice(0,8).map(x=>`<tr><td>${esc(x.incoming.name||'未入力')}</td><td>${esc(x.incoming.company)}</td><td>${pill(x.matches.length?'重複候補':'新規候補',x.matches.length?'amber':'green')}</td></tr>`).join('')}</tbody></table></div><p class="file-meta">先頭8件を表示。登録時に最新データで再照合します。</p><label class="stop-box"><input id="confirm-import" type="checkbox"><span>内容と保存先を確認しました。原CSVを保管して登録します。</span></label><button class="button primary" id="commit-import">原本を保存して取り込む</button>`;
  } catch(e){target.innerHTML=`<div class="inline-error">${esc(e.message)}</div>`;}
}
async function act(task) {
  if(busy)return;busy=true;document.body.setAttribute('aria-busy','true');
  const buttons=Array.from(document.querySelectorAll('button:not(:disabled)'));buttons.forEach(b=>b.disabled=true);
  try{await task();}catch(e){tell(e.message,true);}finally{busy=false;buttons.forEach(b=>{if(b.isConnected)b.disabled=false;});document.body.removeAttribute('aria-busy');}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||busy)return;
  if(b.dataset.view){view=b.dataset.view;render();}
  if(b.hasAttribute('data-new'))openEditor();
  if(b.dataset.edit)openEditor(data.customers.find(c=>c.id===b.dataset.edit));
  if(b.hasAttribute('data-close'))$('#editor').close();
  if(b.hasAttribute('data-refresh'))act(refresh);
  if(b.hasAttribute('data-initialize'))act(async()=>{data=await api('initializeApp');connection();render();tell('管理用のシートを作成しました。');});
  if(b.id==='prev-page'||b.id==='next-page'){page+=b.id==='next-page'?1:-1;customerRows();}
  if(b.id==='commit-import')act(async()=>{
    if(!$('#confirm-import').checked)throw new Error('内容と原本の保存を確認し、チェックしてください。');
    const input=await filePayload(csvFile);input.mime='text/csv';input.encoding=$('#encoding').value;
    data=await api('importSansan',input);tell(data.message);view='history';connection();render();
  });
  if(b.dataset.resolve)act(async()=>{
    const card=b.closest('[data-review]');
    data=await api('resolveDuplicate',{reviewId:card.dataset.review,mode:b.dataset.resolve,customerId:$('.review-target',card).value,reason:$('.review-reason',card).value});
    tell(data.message);connection();render();
  });
  if(b.id==='read-image')act(async()=>{
    const result=await api('readBusinessCard',await filePayload(imageFile));data=result;connection();
    const image=result.image;
    if(!image){throw new Error('画像の処理状態を確認してください。履歴を更新してから再試行してください。');}
    $('#ocr-result').innerHTML=`<p class="note">${esc(result.message)}</p><label>読取結果（要確認）<textarea readonly rows="8">${esc(image.text||'デモでは文字読取を実行しません。GAS版で利用できます。')}</textarea></label><button class="button primary" id="use-card">内容を確認して入力する</button>`;
    $('#use-card').onclick=()=>openEditor(Object.assign({source:'名刺画像',imageId:image.id,consent:'未確認'},image.suggestions||{}));
    tell(result.message);
  });
});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;page=0;customerRows();}});
document.addEventListener('change',async e=>{
  if(e.target.id==='status-filter'){filter=e.target.value;page=0;customerRows();}
  if(e.target.id==='csv-input'){csvFile=e.target.files[0];if(csvFile&&csvFile.size>2*1024*1024){csvFile=null;tell('CSVは2MBまでです。',true);return;}await csvPreview();}
  if(e.target.id==='encoding')await csvPreview();
  if(['image-input','photo-input'].includes(e.target.id)) {
    const f=e.target.files[0];if(!f)return;
    if(!['image/jpeg','image/png'].includes(f.type)||f.size>5*1024*1024){tell('5MB以下のJPEG・PNGを選んでください。',true);return;}
    imageFile=f;if(imageUrl)URL.revokeObjectURL(imageUrl);imageUrl=URL.createObjectURL(f);
    const img=document.createElement('img');img.src=imageUrl;img.alt='選択した名刺';img.className='image-preview';$('#image-preview').replaceChildren(img);$('#read-image').disabled=false;$('#ocr-result').replaceChildren();
  }
});
$('#customer-form').addEventListener('submit',e=>{
  e.preventDefault();act(async()=>{
    const form=e.target,input=Object.fromEntries(new FormData(form));input.source=form.elements.source.value;input.stopped=form.elements.stopped.checked;
    if(input.consentAt)input.consentAt=new Date(input.consentAt).toISOString();
    try {data=await api('saveCustomer',input);$('#editor').close();tell(data.message);connection();render();}
    catch(err){$('#form-error').textContent=err.message;$('#form-error').hidden=false;$('#form-error').scrollIntoView({block:'nearest'});}
  });
});
refresh().catch(e=>{
  window.appBoot.ready();
  const needsSetup=/setupApp/.test(e.message);
  $('#main').innerHTML='<div class="panel empty"><h2>'+(needsSetup?'最初の設定を行います':'読み込めませんでした')+'</h2><p>'+esc(needsSetup?'接続先のスプレッドシートに、顧客一覧と履歴用の管理シートを作成します。既存のシートは削除しません。':e.message)+'</p><button class="button '+(needsSetup?'primary':'')+'" '+(needsSetup?'data-initialize':'data-refresh')+'>'+(needsSetup?'管理シートを作成して始める':'再読込')+'</button></div>';
  if(!needsSetup)tell(e.message,true);
});

</script>
